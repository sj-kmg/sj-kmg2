# Firebase App Hosting 런타임 설정 (Next.js SSR + API 라우트)
# 문서: https://firebase.google.com/docs/app-hosting/configure

runConfig:
  # 사내 인원 수십 명 규모 — 최소 인스턴스 0으로 두어 유휴 비용을 없앤다
  minInstances: 0
  maxInstances: 2
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # 수료증·검진결과서·사진이 저장되는 Cloud Storage 버킷
  - variable: FIREBASE_STORAGE_BUCKET
    value: sj-kmg-deploy2.firebasestorage.app
    availability:
      - RUNTIME

  # 구글 로그인 시 관리자로 인정할 계정 (쉼표로 여러 개 지정 가능).
  # 이 계정만 [권한허용] 화면에서 다른 사람의 열람을 승인할 수 있다.
  - variable: SJ_ADMIN_EMAILS
    value: aldrb5@gmail.com
    availability:
      - RUNTIME

  # 관리자 암호 — 모든 기능. 기록 수정·삭제 가능
  - variable: SJ_PASSCODE
    secret: sj-passcode
    availability:
      - RUNTIME

  # 현장 암호 — TBM일지·아차사고 작성만 가능 (삭제·수정 불가, 다른 메뉴 접근 불가)
  #   변경: firebase apphosting:secrets:set sj-field-passcode
  - variable: SJ_FIELD_PASSCODE
    secret: sj-field-passcode
    availability:
      - RUNTIME

  # 위험성평가 AI 초안 생성용 Google AI Studio 키.
  # 미등록 상태라 비활성화해 둠 — AI 자동 생성만 동작하지 않고 나머지는 정상이다.
  # 재활성화: 아래 명령으로 키를 등록한 뒤 주석을 풀고 다시 배포한다.
  #   firebase apphosting:secrets:set google-generative-ai-api-key
  #   firebase deploy --only apphosting
  # - variable: GOOGLE_GENERATIVE_AI_API_KEY
  #   secret: google-generative-ai-api-key
  #   availability:
  #     - RUNTIME
